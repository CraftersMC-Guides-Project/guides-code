<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftersMC Player & Profile Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #10b981;
            --dark: #1e293b;
            --darker: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --gray-light: #e2e8f0;
            --border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--light);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 0;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 2.8rem;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--gray);
            font-size: 1.1rem;
        }

        .api-panel {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .api-panel h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: var(--light);
        }

        .api-panel h2 i {
            color: var(--primary);
        }

        .input-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: var(--gray-light);
            font-size: 0.95rem;
        }

        input, select {
            padding: 12px 15px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--light);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        input::placeholder {
            color: var(--gray);
        }

        .btn {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-success {
            background: var(--success);
        }

        .btn-success:hover {
            background: #0da271;
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .status.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            display: flex;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            display: flex;
        }

        .status.info {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid var(--info);
            color: var(--info);
            display: flex;
        }

        .data-section {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .data-section h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: var(--light);
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .data-section h2 i {
            color: var(--primary);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--gray);
        }

        .loading i {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .card-header i {
            color: var(--primary);
            font-size: 1.2rem;
        }

        .card-title {
            font-weight: 600;
            color: var(--light);
        }

        .card-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .data-item:last-child {
            border-bottom: none;
        }

        .data-label {
            color: var(--gray);
            font-weight: 500;
        }

        .data-value {
            color: var(--light);
            font-weight: 600;
            text-align: right;
            max-width: 60%;
            word-break: break-word;
        }

        .data-value.number {
            color: var(--secondary);
        }

        .data-value.boolean {
            color: var(--warning);
        }

        .data-value.string {
            color: var(--info);
        }

        .data-value.date {
            color: #8b5cf6;
        }

        .data-value.currency {
            color: var(--success);
        }

        .collapse-section {
            margin-bottom: 20px;
        }

        .collapse-header {
            background: rgba(15, 23, 42, 0.8);
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .collapse-header:hover {
            background: rgba(15, 23, 42, 1);
            border-color: var(--primary);
        }

        .collapse-header h3 {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--light);
        }

        .collapse-header i {
            transition: transform 0.3s ease;
        }

        .collapse-header.collapsed i {
            transform: rotate(-90deg);
        }

        .collapse-content {
            padding: 20px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 8px 8px;
            display: none;
        }

        .collapse-content.expanded {
            display: block;
        }

        .json-viewer {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .json-key {
            color: #ff79c6;
        }

        .json-string {
            color: #f1fa8c;
        }

        .json-number {
            color: #bd93f9;
        }

        .json-boolean {
            color: #ffb86c;
        }

        .json-null {
            color: #ff5555;
        }

        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: var(--gray);
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .tab:hover {
            background: rgba(37, 99, 235, 0.1);
            color: var(--light);
        }

        .tab.active {
            background: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-box {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--secondary);
        }

        .stat-label {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .profile-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .profile-btn {
            padding: 10px 20px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--gray);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .profile-btn:hover {
            border-color: var(--primary);
            color: var(--light);
        }

        .profile-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(9, 50px);
            gap: 5px;
            margin: 20px 0;
        }

        .inventory-slot {
            width: 50px;
            height: 50px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray);
        }

        .inventory-slot.filled {
            background: rgba(37, 99, 235, 0.2);
            border-color: var(--primary);
            color: var(--light);
        }

        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
            
            .input-group {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .btn-group {
                flex-direction: column;
            }
        }

        .timestamp {
            font-size: 0.85rem;
            color: var(--gray);
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-crown"></i> CraftersMC Viewer</h1>
            <p>View player data, SkyBlock profiles, and bazaar market information</p>
        </div>

        <!-- API Settings Panel -->
        <div class="api-panel">
            <h2><i class="fas fa-cog"></i> API Configuration</h2>
            <div class="input-group">
                <div class="form-group">
                    <label for="apiKey"><i class="fas fa-key"></i> API Key</label>
                    <input type="password" id="apiKey" placeholder="Enter your CraftersMC API key">
                </div>
                <div class="form-group">
                    <label for="proxyUrl"><i class="fas fa-server"></i> Proxy URL</label>
                    <input type="text" id="proxyUrl" placeholder="https://your-worker.workers.dev">
                </div>
            </div>
            <div class="btn-group">
                <button class="btn" onclick="saveSettings()">
                    <i class="fas fa-save"></i> Save Settings
                </button>
                <button class="btn btn-success" onclick="testConnection()">
                    <i class="fas fa-plug"></i> Test Connection
                </button>
            </div>
            <div id="status" class="status"></div>
        </div>

        <!-- Search Panel -->
        <div class="data-section">
            <h2><i class="fas fa-search"></i> Search</h2>
            <div class="input-group">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> Username</label>
                    <input type="text" id="username" placeholder="Enter Minecraft username">
                </div>
                <div class="form-group">
                    <label for="profileId"><i class="fas fa-id-card"></i> Profile ID (Optional)</label>
                    <input type="text" id="profileId" placeholder="Enter profile ID (or leave blank for first profile)">
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-success" onclick="fetchPlayerData()">
                    <i class="fas fa-download"></i> Fetch Player Data
                </button>
                <button class="btn" onclick="clearData()">
                    <i class="fas fa-trash"></i> Clear
                </button>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="loading" style="display: none;">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading data...</p>
        </div>

        <!-- Profile Selector -->
        <div id="profileSelector" class="profile-selector" style="display: none;"></div>

        <!-- Main Data Display -->
        <div id="mainData" style="display: none;">
            <!-- Tabs Navigation -->
            <div class="tabs">
                <button class="tab active" onclick="switchTab('overview')">Overview</button>
                <button class="tab" onclick="switchTab('player')">Player Data</button>
                <button class="tab" onclick="switchTab('profile')">Profile Data</button>
                <button class="tab" onclick="switchTab('collections')">Collections</button>
                <button class="tab" onclick="switchTab('inventory')">Inventory</button>
                <button class="tab" onclick="switchTab('skills')">Skills</button>
                <button class="tab" onclick="switchTab('json')">Raw JSON</button>
            </div>

            <!-- Tab Contents -->
            <div id="overviewTab" class="tab-content active">
                <!-- Overview content will be populated -->
            </div>

            <div id="playerTab" class="tab-content">
                <!-- Player data content will be populated -->
            </div>

            <div id="profileTab" class="tab-content">
                <!-- Profile data content will be populated -->
            </div>

            <div id="collectionsTab" class="tab-content">
                <!-- Collections content will be populated -->
            </div>

            <div id="inventoryTab" class="tab-content">
                <!-- Inventory content will be populated -->
            </div>

            <div id="skillsTab" class="tab-content">
                <!-- Skills content will be populated -->
            </div>

            <div id="jsonTab" class="tab-content">
                <!-- Raw JSON content will be populated -->
            </div>
        </div>

        <div class="timestamp" id="timestamp"></div>
    </div>

    <script>
        // Configuration
        const config = {
            apiKey: '',
            proxyUrl: ''
        };

        // State
        let playerData = null;
        let profileData = null;
        let currentProfileId = '';

        // Format functions
        function formatNumber(num) {
            if (num === null || num === undefined) return 'N/A';
            if (typeof num === 'number') {
                if (num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
                if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
                return num.toLocaleString();
            }
            return num;
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            try {
                const date = new Date(timestamp);
                return date.toLocaleString();
            } catch {
                return timestamp;
            }
        }

        function formatBoolean(bool) {
            return bool ? 'Yes' : 'No';
        }

        function formatCurrency(amount) {
            if (amount === null || amount === undefined) return 'N/A';
            return '$' + formatNumber(amount);
        }

        // API Functions
        async function makeRequest(endpoint) {
            if (!config.apiKey || !config.proxyUrl) {
                showStatus('Please configure API key and proxy URL first', 'error');
                return null;
            }

            const proxyUrl = config.proxyUrl.replace(/\/$/, '');
            const url = `${proxyUrl}${endpoint}`;

            try {
                const response = await fetch(url, {
                    headers: {
                        'X-API-Key': config.apiKey,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                return await response.json();
            } catch (error) {
                console.error('Request failed:', error);
                showStatus(`Request failed: ${error.message}`, 'error');
                return null;
            }
        }

        async function fetchPlayerData() {
            const username = document.getElementById('username').value.trim();
            if (!username) {
                showStatus('Please enter a username', 'error');
                return;
            }

            showLoading(true);
            showStatus('Fetching player data...', 'info');

            const data = await makeRequest(`/player/${username}`);
            if (!data) {
                showLoading(false);
                return;
            }

            playerData = data;
            showStatus('Player data loaded successfully!', 'success');

            // Display profiles if available
            if (playerData.stats?.skyBlock?.profiles) {
                displayProfiles(playerData.stats.skyBlock.profiles);
            }

            // Fetch profile data if profileId is provided
            const profileId = document.getElementById('profileId').value.trim();
            if (profileId) {
                await fetchProfileData(profileId);
            } else {
                // Fetch the first profile
                const profiles = playerData.stats?.skyBlock?.profiles;
                if (profiles && Object.keys(profiles).length > 0) {
                    const firstProfileId = Object.keys(profiles)[0];
                    await fetchProfileData(firstProfileId);
                } else {
                    showLoading(false);
                    displayPlayerData();
                }
            }
        }

        async function fetchProfileData(profileId) {
            showStatus(`Fetching profile data for ${profileId}...`, 'info');
            currentProfileId = profileId;

            const data = await makeRequest(`/profile/${profileId}`);
            if (!data) {
                showLoading(false);
                return;
            }

            profileData = data;
            showStatus('Profile data loaded successfully!', 'success');
            showLoading(false);
            displayAllData();
        }

        // Display Functions
        function displayProfiles(profiles) {
            const selector = document.getElementById('profileSelector');
            selector.innerHTML = '';
            
            if (!profiles || Object.keys(profiles).length === 0) {
                selector.style.display = 'none';
                return;
            }

            selector.style.display = 'flex';
            
            Object.entries(profiles).forEach(([profileId, profile]) => {
                const btn = document.createElement('button');
                btn.className = 'profile-btn';
                if (profileId === currentProfileId) {
                    btn.classList.add('active');
                }
                
                btn.innerHTML = `
                    <i class="fas fa-id-card"></i>
                    ${profile.cuteName || 'Unknown'} (${profileId.substring(0, 8)}...)
                `;
                
                btn.onclick = () => fetchProfileData(profileId);
                selector.appendChild(btn);
            });
        }

        function displayAllData() {
            document.getElementById('mainData').style.display = 'block';
            displayPlayerData();
            displayProfileData();
            displayOverview();
            displayCollections();
            displaySkills();
            displayJSON();
            updateTimestamp();
        }

        function displayOverview() {
            const container = document.getElementById('overviewTab');
            container.innerHTML = '';

            if (!playerData || !profileData) return;

            // Player stats
            let html = `
                <div class="cards-grid">
                    <div class="card">
                        <div class="card-header">
                            <i class="fas fa-user"></i>
                            <div class="card-title">Player Info</div>
                        </div>
                        <div class="card-body">
                            <div class="data-item">
                                <span class="data-label">Username</span>
                                <span class="data-value string">${playerData.name || 'N/A'}</span>
                            </div>
                            <div class="data-item">
                                <span class="data-label">Rank</span>
                                <span class="data-value string">${playerData.selectedRank || 'N/A'}</span>
                            </div>
                            <div class="data-item">
                                <span class="data-label">First Login</span>
                                <span class="data-value date">${formatDate(playerData.firstLogin)}</span>
                            </div>
                            <div class="data-item">
                                <span class="data-label">Last Login</span>
                                <span class="data-value date">${formatDate(playerData.lastLogin)}</span>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <i class="fas fa-gamepad"></i>
                            <div class="card-title">Profile Info</div>
                        </div>
                        <div class="card-body">
                            <div class="data-item">
                                <span class="data-label">Profile Name</span>
                                <span class="data-value string">${profileData.cuteName || 'N/A'}</span>
                            </div>
                            <div class="data-item">
                                <span class="data-label">Game Mode</span>
                                <span class="data-value string">${profileData.gameMode || 'N/A'}</span>
                            </div>
                            <div class="data-item">
                                <span class="data-label">Created At</span>
                                <span class="data-value date">${formatDate(profileData.createdAt)}</span>
                            </div>
                            <div class="data-item">
                                <span class="data-label">Bank Tier</span>
                                <span class="data-value string">${profileData.banking?.tier || 'N/A'}</span>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <i class="fas fa-coins"></i>
                            <div class="card-title">Economy</div>
                        </div>
                        <div class="card-body">
                            <div class="data-item">
                                <span class="data-label">Bank Balance</span>
                                <span class="data-value currency">${formatCurrency(profileData.banking?.balance)}</span>
                            </div>
                            <div class="data-item">
                                <span class="data-label">Highest Balance</span>
                                <span class="data-value currency">${formatCurrency(profileData.banking?.highestBalance)}</span>
                            </div>
                            <div class="data-item">
                                <span class="data-label">Network Coins</span>
                                <span class="data-value currency">${formatCurrency(playerData.networkCoins)}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Quick stats
            if (profileData.members) {
                const memberId = Object.keys(profileData.members)[0];
                const member = profileData.members[memberId];
                
                if (member) {
                    html += `
                        <div class="data-section">
                            <h2><i class="fas fa-chart-line"></i> Quick Stats</h2>
                            <div class="stats-grid">

        function displayJSON() {
            const container = document.getElementById('jsonTab');
            
            const allData = {
                player: playerData,
                profile: profileData,
                timestamp: new Date().toISOString()
            };

            container.innerHTML = `
                <h3><i class="fas fa-code"></i> Raw JSON Data</h3>
                <div class="tabs">
                    <button class="tab active" onclick="switchJsonTab('all')">All Data</button>
                    <button class="tab" onclick="switchJsonTab('player')">Player Only</button>
                    <button class="tab" onclick="switchJsonTab('profile')">Profile Only</button>
                </div>
                <div id="jsonAll" class="json-viewer">${syntaxHighlight(JSON.stringify(allData, null, 2))}</div>
                <div id="jsonPlayer" class="json-viewer" style="display: none;">${syntaxHighlight(JSON.stringify(playerData, null, 2))}</div>
                <div id="jsonProfile" class="json-viewer" style="display: none;">${syntaxHighlight(JSON.stringify(profileData, null, 2))}</div>
            `;
        }

        // Helper Functions
        function createDataCard(icon, title, items) {
            let html = `
                <div class="card">
                    <div class="card-header">
                        <i class="${icon}"></i>
                        <div class="card-title">${title}</div>
                    </div>
                    <div class="card-body">
            `;

            items.forEach(([label, value, type]) => {
                html += `
                    <div class="data-item">
                        <span class="data-label">${label}</span>
                        <span class="data-value ${type}">${value || 'N/A'}</span>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;

            return html;
        }

        function createCollapseSection(icon, title, data, isNested = false) {
            const id = title.replace(/\s+/g, '-').toLowerCase();
            
            let html = `
                <div class="collapse-section">
                    <div class="collapse-header" onclick="toggleCollapse('${id}')">
                        <h3><i class="${icon}"></i> ${title} (${Object.keys(data).length} items)</h3>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div id="${id}" class="collapse-content">
            `;

            if (isNested && typeof data === 'object') {
                html += renderNestedObject(data, 0);
            } else {
                html += renderSimpleObject(data);
            }

            html += `
                    </div>
                </div>
            `;

            return html;
        }

        function renderSimpleObject(obj) {
            if (!obj || typeof obj !== 'object') {
                return `<div class="data-value">${obj}</div>`;
            }

            let html = '<div class="cards-grid">';
            
            Object.entries(obj).forEach(([key, value]) => {
                let displayValue = value;
                let type = 'string';
                
                if (typeof value === 'number') {
                    displayValue = formatNumber(value);
                    type = 'number';
                } else if (typeof value === 'boolean') {
                    displayValue = formatBoolean(value);
                    type = 'boolean';
                } else if (Array.isArray(value)) {
                    displayValue = `[${value.length} items]`;
                    type = 'string';
                } else if (typeof value === 'object' && value !== null) {
                    displayValue = '{...}';
                    type = 'string';
                }
                
                html += `
                    <div class="data-item">
                        <span class="data-label">${key}</span>
                        <span class="data-value ${type}">${displayValue}</span>
                    </div>
                `;
            });

            html += '</div>';
            return html;
        }

        function renderNestedObject(obj, depth = 0) {
            if (!obj || typeof obj !== 'object') {
                return `<div style="margin-left: ${depth * 20}px">${obj}</div>`;
            }

            let html = '';
            
            Object.entries(obj).forEach(([key, value]) => {
                if (typeof value === 'object' && value !== null && !Array.isArray(value)) {
                    html += `
                        <div class="collapse-section" style="margin-left: ${depth * 10}px">
                            <div class="collapse-header" onclick="toggleCollapse('${key}-${depth}')">
                                <h3><i class="fas fa-folder"></i> ${key}</h3>
                                <i class="fas fa-chevron-down"></i>
                            </div>
                            <div id="${key}-${depth}" class="collapse-content">
                                ${renderNestedObject(value, depth + 1)}
                            </div>
                        </div>
                    `;
                } else {
                    let displayValue = value;
                    let type = 'string';
                    
                    if (typeof value === 'number') {
                        displayValue = formatNumber(value);
                        type = 'number';
                    } else if (typeof value === 'boolean') {
                        displayValue = formatBoolean(value);
                        type = 'boolean';
                    } else if (Array.isArray(value)) {
                        displayValue = `Array[${value.length}]`;
                        type = 'string';
                    }
                    
                    html += `
                        <div class="data-item" style="margin-left: ${depth * 20}px">
                            <span class="data-label">${key}</span>
                            <span class="data-value ${type}">${displayValue}</span>
                        </div>
                    `;
                }
            });

            return html;
        }

        function syntaxHighlight(json) {
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, 
                function (match) {
                    let cls = 'json-number';
                    if (/^"/.test(match)) {
                        if (/:$/.test(match)) {
                            cls = 'json-key';
                        } else {
                            cls = 'json-string';
                        }
                    } else if (/true|false/.test(match)) {
                        cls = 'json-boolean';
                    } else if (/null/.test(match)) {
                        cls = 'json-null';
                    }
                    return '<span class="' + cls + '">' + match + '</span>';
                });
        }

        // UI Functions
        function toggleCollapse(id) {
            const content = document.getElementById(id);
            const header = content.previousElementSibling;
            
            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                header.classList.add('collapsed');
            } else {
                content.classList.add('expanded');
                header.classList.remove('collapsed');
            }
        }

        function setupCollapseButtons() {
            document.querySelectorAll('.collapse-header').forEach(header => {
                header.classList.add('collapsed');
            });
        }

        function switchTab(tabName) {
            // Update tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            // Activate selected tab
            document.querySelector(`.tab[onclick="switchTab('${tabName}')"]`).classList.add('active');
            document.getElementById(`${tabName}Tab`).classList.add('active');
        }

        function switchJsonTab(tabName) {
            document.querySelectorAll('#jsonTab .tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelector(`#jsonTab .tab[onclick="switchJsonTab('${tabName}')"]`).classList.add('active');

            document.getElementById('jsonAll').style.display = tabName === 'all' ? 'block' : 'none';
            document.getElementById('jsonPlayer').style.display = tabName === 'player' ? 'block' : 'none';
            document.getElementById('jsonProfile').style.display = tabName === 'profile' ? 'block' : 'none';
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            
            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    status.style.display = 'none';
                }, 5000);
            }
        }

        function updateTimestamp() {
            document.getElementById('timestamp').textContent = 
                `Last updated: ${new Date().toLocaleString()}`;
        }

        function clearData() {
            playerData = null;
            profileData = null;
            currentProfileId = '';
            
            document.getElementById('username').value = '';
            document.getElementById('profileId').value = '';
            document.getElementById('profileSelector').style.display = 'none';
            document.getElementById('mainData').style.display = 'none';
            document.getElementById('timestamp').textContent = '';
            
            showStatus('Data cleared', 'success');
        }

        // Settings Functions
        function saveSettings() {
            config.apiKey = document.getElementById('apiKey').value.trim();
            config.proxyUrl = document.getElementById('proxyUrl').value.trim();
            
            if (!config.apiKey || !config.proxyUrl) {
                showStatus('Please enter both API key and proxy URL', 'error');
                return;
            }
            
            localStorage.setItem('craftersmc_config', JSON.stringify(config));
            showStatus('Settings saved successfully!', 'success');
        }

        function loadSettings() {
            const saved = localStorage.getItem('craftersmc_config');
            if (saved) {
                try {
                    Object.assign(config, JSON.parse(saved));
                    document.getElementById('apiKey').value = config.apiKey || '';
                    document.getElementById('proxyUrl').value = config.proxyUrl || '';
                } catch (e) {
                    console.error('Error loading settings:', e);
                }
            }
        }

        async function testConnection() {
            if (!config.apiKey || !config.proxyUrl) {
                showStatus('Please save settings first', 'error');
                return;
            }
            
            showStatus('Testing connection...', 'info');
            
            try {
                const proxyUrl = config.proxyUrl.replace(/\/$/, '');
                const response = await fetch(proxyUrl, {
                    headers: {
                        'X-API-Key': config.apiKey,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    showStatus('✓ Connection successful!', 'success');
                } else {
                    showStatus(`Connection failed: HTTP ${response.status}`, 'error');
                }
            } catch (error) {
                showStatus(`Connection failed: ${error.message}`, 'error');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            
            // Set default proxy URL if none
            if (!document.getElementById('proxyUrl').value) {
                document.getElementById('proxyUrl').value = 'https://craftersmc-proxy.worker.dev';
            }
            
            // Auto-focus username input
            document.getElementById('username').focus();
            
            // Enter key support
            document.getElementById('username').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') fetchPlayerData();
            });
            document.getElementById('profileId').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') fetchPlayerData();
            });
        });
    </script>
