    html {

      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1a1a2e;
    }

    .container {
      display: grid;
      grid-template-columns: 2px 2px auto 2px 2px;
      grid-template-rows: 2px 2px auto 2px 2px;
      grid-template-areas:
        "tl-tl tr-tl t tl-tr tr-tr"
        "bl-tl br-tl t bl-tr br-tr"
        "l l inv r r"
        "tl-bl tr-bl b tl-br tr-br"
        "bl-bl br-bl b bl-br br-br";
    }

    .s-br {
      box-shadow: 2px 0 0 black, 0 2px 0 black;
    }

    .s-bl {
      box-shadow: -2px 0 0 black, 0 2px 0 black;
    }

    .s-tr {
      box-shadow: 0 -2px 0 black, 2px 0 0 black;
    }

    .s-tl {
      box-shadow: 0 -2px 0 black, -2px 0 0 black;
    }

    .corner-top {
      grid-area: t;
      box-shadow: 0 -2px 0 black;
      background-color: #ffffff;
    }

    .corner-left {
      grid-area: l;
      box-shadow: -2px 0 0 black;
      background-color: #ffffff;
    }

    .corner-right {
      grid-area: r;
      box-shadow: 2px 0 0 black;
      background-color: #555555;
    }

    .corner-bottom {
      grid-area: b;
      box-shadow: 0 2px 0 black;
      background-color: #555555;
    }

    .inner-container {
      background-color: #c6c6c6;
      grid-area: inv;
      grid-column: inherit;
    }

    .tl-tl {
      grid-area: tl-tl;
      background-color: #ffffff;
      position: relative;
      bottom: -4px;
      right: -4px;
    }

    .br-br {
      grid-area: br-br;
      background-color: #555555;
      position: relative;
      top: -4px;
      left: -4px;
    }

    .bl-tl,
    .tr-tl,
    .br-tl {
      background-color: #ffffff;
    }

    .bl-tl {
      grid-area: bl-tl;
    }

    .tr-tl {
      grid-area: tr-tl;
    }

    .br-tl {
      grid-area: br-tl;
    }

    .bl-tr {
      grid-area: bl-tr;
      background-color: #c6c6c6;
    }

    .tr-bl {
      grid-area: tr-bl;
      background-color: #c6c6c6;
    }

    .tr-br,
    .tl-br,
    .bl-br {
      background-color: #555555;
    }

    .tr-br {
      grid-area: tr-br;
    }

    .tl-br {
      grid-area: tl-br;
    }

    .bl-br {
      grid-area: bl-br;
    }

    .inventory {
      padding: 0.4rem;
      display: grid;
    }

    .inventory .inner-container,
    .hotbar-extreme-inner-container {
      display: grid;
      grid-column: inherit;
    }

    .cell {
      box-shadow: inset 2px 2px 0 0 #373737, inset -2px -2px 0 0 #ffffff;
      background-color: #8b8b8b;
      height: 2rem;
      width: 2rem;
      position: relative;
      cursor: pointer;
    }

    .cell:hover {
      background-color: #a1a1a1;
    }

    .cell::before,
    .cell::after {
      content: "";
      height: 2px;
      width: 2px;
      background-color: #8b8b8b;
      position: absolute;
      top: 0;
      right: 0;
    }

    .cell::after {
      top: auto;
      right: auto;
      left: 0;
      bottom: 0;
    }

    .extreme-inner-container,
    .hotbar-extreme-inner-container {
      color: #262626;
      display: grid;
      grid-template-columns: repeat(9, auto);
      grid-template-rows: repeat(4, auto);
    }

    .hotbar-extreme-inner-container {
      margin-top: 0.5rem;
    }

    .inner-container h3 {
      margin: 0 auto 8px auto;
      font-size: 1.2rem;
      color: #333;
      text-align: center;
    }

    .cell img {
      height: 1.5rem;
      width: 1.5rem;
      margin: 0.25rem;
    }

    .cat {
      background-color: #c6c6c6;
      box-shadow: inset 4px 4px 0 0 #fff;
      height: 2rem;
      width: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      border-top-right-radius: 5px;
      border-top-left-radius: 5px;
      padding: 20px;
      cursor: pointer;

      border: 1px solid #475569;
      border-radius: 4px;
      color: #e2e8f0;
    }

    .api-button {

      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }

    .api-button:hover {
      background: #2563eb;
    }

    .item-tooltip {
      position: absolute;
      left: 110%;
      top: 0;
      background: #2d143b;
      color: #ffe16b;
      border: 2px solid #4b267a;
      border-radius: 6px;
      padding: 12px;
      z-index: 100;
      min-width: 250px;
      font-family: 'Minecraft', 'Arial', sans-serif;

      white-space: normal;
      box-shadow:

        -4px -4px 0 0 #fff,
        4px -4px 0 0 #fff,
        -4px 4px 0 0 #555,
        4px 4px 0 0 #555;
      font-weight: bold;
      display: none;
    }

      display: block;
    }

    .item-tooltip .item-title {
      color: #6d5cff;
      font-weight: bold;
      font-size: 1.1rem;
      display: block;
      margin-bottom: 8px;
    }

    .item-tooltip .item-data {
      margin-top: 8px;
      border-top: 1px solid #4b267a;
      padding-top: 8px;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 12px;
    }

    .data-label {
      color: #a3a3ff;
    }

    .data-value {
      color: #ffffff;
      font-weight: bold;
    }

    .price-up {
      color: #4CAF50 !important;
    }

    .price-down {
      color: #F44336 !important;
    }

    .loading {

      font-style: italic;
      text-align: center;
      padding: 5px;
    }

      font-size: 11px;
      text-align: center;
      padding: 5px;
      border: 1px solid #ff6b6b;
      border-radius: 3px;

      padding: 5px;

      height: 24px;

    // ==================== CORE FUNCTIONS ====================
    // Format currency
    function formatCurrency(amount) {
      if (amount === undefined || amount === null) return 'N/A';
      if (amount >= 1000000) return (amount / 1000000).toFixed(2) + 'M';
      if (amount >= 1000) return (amount / 1000).toFixed(1) + 'K';
      return Math.round(amount).toLocaleString();
    }

    // Format number
    function formatNumber(num) {
      if (num === undefined || num === null) return 'N/A';
      return num.toLocaleString();
    }

    // Get item ID from name
    function getItemId(itemName) {
      const id = itemIdMap[itemName] || itemName.toLowerCase().replace(/ /g, '_');
      console.log(`Mapped "${itemName}" to "${id}"`);
      return id;
    }

    // Generate mock data for fallback
    function generateMockData(itemId) {
      const seed = Array.from(itemId).reduce((acc, char) => acc + char.charCodeAt(0), 0);
      const basePrice = (seed % 500) + 50;
      const variation = Math.sin(seed) * 20;
      
      return {
        buyTopEntries: [{ 
          price: basePrice + variation, 
          quantity: Math.floor(Math.random() * 5000) + 1000 
        }],
        sellTopEntries: [{ 
          price: basePrice + variation + (Math.random() * 10 + 5), 
          quantity: Math.floor(Math.random() * 5000) + 1000 
        }],
        weeklyAveragePrice: basePrice + variation + 5,
        buyVolume: Math.floor(Math.random() * 50000) + 10000,
        sellVolume: Math.floor(Math.random() * 50000) + 10000,
        _isMock: true
      };
    }

    // Fetch bazaar data through Cloudflare Worker
    async function fetchBazaarData(itemName) {
      const itemId = getItemId(itemName);
      console.log(`Fetching data for: ${itemName} (ID: ${itemId})`);
      
      // Check cache first (30 second cache for live data, 5 minutes for mock)
      const cached = bazaarCache.get(itemId);
      if (cached) {
        const cacheTime = cached.data._isMock ? 300000 : 30000; // 5 min vs 30 sec
        if (Date.now() - cached.timestamp < cacheTime) {
          console.log(`Using cached data for ${itemId}`);
          return cached.data;
        }
      }

      if (!apiSettings.apiKey) {
        console.log(`No API key set, using mock data for ${itemId}`);
        const mockData = generateMockData(itemId);
        bazaarCache.set(itemId, { data: mockData, timestamp: Date.now() });
        return mockData;
      }

      if (!apiSettings.proxyUrl) {
        console.log(`No proxy URL set, using mock data for ${itemId}`);
        const mockData = generateMockData(itemId);
        bazaarCache.set(itemId, { data: mockData, timestamp: Date.now() });
        return mockData;
      }

      try {
        // Build the proxy URL
        const proxyUrl = apiSettings.proxyUrl.replace(/\/$/, ''); // Remove trailing slash
        const url = `${proxyUrl}/${itemId}`;
        
        console.log(`Making request to: ${url}`);
        
        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'X-API-Key': apiSettings.apiKey,
            'Content-Type': 'application/json'
          }
        });
        
        console.log(`Response status: ${response.status}`);
        
        if (!response.ok) {
          const errorText = await response.text();
          console.error(`HTTP ${response.status}: ${errorText}`);
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        console.log(`Successfully fetched data for ${itemId}`, data);
        
        // Check if it's an error response from the proxy
        if (data.error) {
          console.error(`Proxy error for ${itemId}:`, data.error);
          throw new Error(`Proxy error: ${data.error}`);
        }
        
        // Cache successful response
        bazaarCache.set(itemId, {
          data: data,
          timestamp: Date.now()
        });
        
        return data;
        
      } catch (error) {
        console.warn(`Failed to fetch ${itemId} via proxy, using mock data:`, error.message);
        
        // Fallback to mock data
        const mockData = generateMockData(itemId);
        bazaarCache.set(itemId, { data: mockData, timestamp: Date.now() });
        return mockData;
      }
    }

    // Generate tooltip HTML
    async function generateTooltipHTML(item) {
      // If item has subItems, show sub-items grid
      if (item.subItems && item.subItems.length > 0) {
        const subItemsGrid = item.subItems.slice(0, 6).map(sub => `
          <div class="sub-item" data-item='${JSON.stringify(sub).replace(/'/g, "\\'")}'>
            <img src="img/${sub.img}" alt="${sub.name}" onerror="this.src='https://via.placeholder.com/24/8b8b8b/000?text=?'">
            <div class="sub-item-name">${sub.name.length > 10 ? sub.name.substring(0, 8) + '...' : sub.name}</div>
          </div>
        `).join('');

        return `
          <span class="item-title">${item.name}</span>
          <div class="sub-items-grid">
            ${subItemsGrid}
          </div>
          ${item.subItems.length > 6 ? `<div style="text-align:center;color:#ccc;">+${item.subItems.length - 6} more items</div>` : ''}
        `;
      }

      // For single items, fetch API data
      const bazaarData = await fetchBazaarData(item.name);
      
      const isMockData = bazaarData._isMock === true;
      const hasError = bazaarData.error || !bazaarData.buyTopEntries;
      
      const buyPrice = bazaarData.buyTopEntries?.[0]?.price || 0;
      const sellPrice = bazaarData.sellTopEntries?.[0]?.price || 0;
      const weeklyAvg = bazaarData.weeklyAveragePrice || 0;
      const buyVolume = bazaarData.buyVolume || 0;
      const sellVolume = bazaarData.sellVolume || 0;
      
      const priceDiff = sellPrice - buyPrice;
      const diffPercent = buyPrice > 0 ? (priceDiff / buyPrice * 100) : 0;
      const diffClass = priceDiff > 0 ? 'price-up' : priceDiff < 0 ? 'price-down' : '';
      
      let html = `<span class="item-title">${item.name}</span>`;
      
      // Status badge
      if (hasError) {
        html += `<div class="status-badge status-error">API Error</div>`;
      } else if (isMockData) {
        html += `<div class="status-badge status-mock">Mock Data</div>`;
      } else {
        html += `<div class="status-badge status-live">Live Data</div>`;
      }
      
      html += `
        <div class="item-data">
          <div class="data-row">
            <span class="data-label">Buy Price:</span>
            <span class="data-value">${formatCurrency(buyPrice)}</span>
          </div>
          <div class="data-row">
            <span class="data-label">Sell Price:</span>
            <span class="data-value">${formatCurrency(sellPrice)}</span>
          </div>
      `;
      
      if (!hasError) {
        html += `
          <div class="data-row">
            <span class="data-label">Instant Profit:</span>
            <span class="data-value ${diffClass}">${formatCurrency(priceDiff)} (${diffPercent.toFixed(1)}%)</span>
          </div>
          <div class="data-row">
            <span class="data-label">7-Day Average:</span>
            <span class="data-value">${formatCurrency(weeklyAvg)}</span>
          </div>
          <div class="data-row">
            <span class="data-label">Buy Volume:</span>
            <span class="data-value">${formatNumber(buyVolume)}</span>
          </div>
          <div class="data-row">
            <span class="data-label">Sell Volume:</span>
            <span class="data-value">${formatNumber(sellVolume)}</span>
          </div>
        `;
      }
      
      if (isMockData) {
        html += `
          <div style="margin-top: 8px; padding-top: 8px; border-top: 1px dashed #4b267a;">
            <div style="color: #ff9800; font-size: 10px; text-align: center;">
              Enter API key and Cloudflare Worker URL to get live data
            </div>
          </div>
        `;
      }
      
      html += `</div>`;
      return html;
    }

    // Fill cells with items
    async function fillCells(itemsList) {
      const mainGrid = document.getElementById('mainGrid');
      const hotbarGrid = document.getElementById('hotbarGrid');
      
      mainGrid.innerHTML = '';
      hotbarGrid.innerHTML = '';
      
      // Fill main grid (36 cells)
      for (let i = 0; i < 36; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        
        if (i < itemsList.length) {
          const item = itemsList[i];
          cell.innerHTML = `
            <div class="item-with-sub">
              <img src="img/${item.img}" alt="${item.name}" 
                   onerror="this.src='https://via.placeholder.com/24/8b8b8b/000?text=?'">
              <div class="item-tooltip">
                <div class="loading">Loading...</div>
              </div>
            </div>
          `;
          
          setupTooltip(cell, item);
          
          // Click handler for items with subItems
          if (item.subItems && item.subItems.length > 0) {
            cell.addEventListener('click', () => {
              fillCells(item.subItems);
            });
          }
        }
        
        mainGrid.appendChild(cell);
      }
      
      // Fill hotbar (9 cells)
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        
        const itemIndex = 36 + i;
        if (itemIndex < itemsList.length) {
          const item = itemsList[itemIndex];
          cell.innerHTML = `
            <div class="item-with-sub">
              <img src="img/${item.img}" alt="${item.name}" 
                   onerror="this.src='https://via.placeholder.com/24/8b8b8b/000?text=?'">
              <div class="item-tooltip">
                <div class="loading">Loading...</div>
              </div>
            </div>
          `;
          
          setupTooltip(cell, item);
          
          if (item.subItems && item.subItems.length > 0) {
            cell.addEventListener('click', () => {
              fillCells(item.subItems);
            });
          }
        }
        
        hotbarGrid.appendChild(cell);
      }
    }

    // Setup tooltip for a cell
    function setupTooltip(cell, item) {
      const itemDiv = cell.querySelector('.item-with-sub');
      const tooltip = itemDiv.querySelector('.item-tooltip');
      
      let tooltipTimeout;
      
      itemDiv.addEventListener('mouseenter', async function(e) {
        clearTimeout(tooltipTimeout);
        
        tooltipTimeout = setTimeout(async () => {
          tooltip.innerHTML = `<div class="loading">Loading market data...</div>`;
          tooltip.style.display = "block";
          
          // Load data
          const content = await generateTooltipHTML(item);
          tooltip.innerHTML = content;
          
          // Setup sub-item click handlers
          const subItems = tooltip.querySelectorAll('.sub-item');
          subItems.forEach(subItem => {
            subItem.addEventListener('click', function(e) {
              e.stopPropagation();
              try {
                const itemData = JSON.parse(this.getAttribute('data-item').replace(/\\'/g, "'"));
                if (itemData.subItems && itemData.subItems.length > 0) {
                  fillCells(itemData.subItems);
                } else {
                  // Show single item tooltip
                  setupTooltip(cell, itemData);
                }
              } catch (error) {
                console.error('Error parsing sub-item data:', error);
              }
            });
          });
          
          // Position tooltip
          positionTooltip(cell, tooltip);
        }, 300);
      });
      
      itemDiv.addEventListener('mouseleave', function() {
        clearTimeout(tooltipTimeout);
        tooltip.style.display = "none";
      });
    }

    // Position tooltip
    function positionTooltip(cell, tooltip) {
      const cellRect = cell.getBoundingClientRect();
      const tooltipRect = tooltip.getBoundingClientRect();
      
      let left = cellRect.right + 10;
      let top = cellRect.top;
      
      // Adjust if tooltip would go off screen
      if (left + tooltipRect.width > window.innerWidth - 10) {
        left = cellRect.left - tooltipRect.width - 10;
      }
      
      if (top + tooltipRect.height > window.innerHeight - 10) {
        top = window.innerHeight - tooltipRect.height - 10;
      }
      
      if (top < 10) {
        top = 10;
      }
      
      tooltip.style.left = (left - cellRect.left) + 'px';
      tooltip.style.top = (top - cellRect.top) + 'px';
    }

    function loadApiSettings() {
      const saved = localStorage.getItem('bazaarApiSettings');
      if (saved) {
        try {
          apiSettings = JSON.parse(saved);
          
          // Update UI
          document.getElementById('apiKey').value = apiSettings.apiKey || '';
          document.getElementById('proxyUrl').value = apiSettings.proxyUrl || DEFAULT_PROXY_URL;
          
          console.log('Loaded API settings:', apiSettings);
        } catch (e) {
          console.error('Error loading API settings:', e);
          showStatus('Error loading saved settings', 'error');
        }
      } else {
        // Set default
        document.getElementById('proxyUrl').value = DEFAULT_PROXY_URL;
      }
    }

    function showStatus(message, type = 'info') {
      const statusDiv = document.getElementById('apiStatus');
      statusDiv.textContent = message;
      statusDiv.className = '';
      
      if (type === 'error') {
        statusDiv.style.color = '#f87171';
        statusDiv.style.backgroundColor = '#fee2e2';
        statusDiv.style.border = '1px solid #fca5a5';
      } else if (type === 'success') {
        statusDiv.style.color = '#10b981';
        statusDiv.style.backgroundColor = '#d1fae5';
        statusDiv.style.border = '1px solid #a7f3d0';
      } else {
        statusDiv.style.color = '#cbd5e1';
        statusDiv.style.backgroundColor = 'transparent';
        statusDiv.style.border = 'none';
      }
      
      // Auto-hide success messages after 5 seconds
      if (type === 'success') {
        setTimeout(() => {
          statusDiv.textContent = '';
          statusDiv.className = '';
        }, 5000);
      }
    }

    // Test the proxy connection
    async function testProxyConnection() {
      if (!apiSettings.apiKey || !apiSettings.proxyUrl) {
        showStatus('Please enter API key and proxy URL first', 'error');
        return;
      }
      
      showStatus('Testing proxy connection...', 'info');
      
      try {
        const proxyUrl = apiSettings.proxyUrl.replace(/\/$/, '');
        const testUrl = `${proxyUrl}/wheat`;
        
        const response = await fetch(testUrl, {
          method: 'GET',
          headers: {
            'X-API-Key': apiSettings.apiKey,
            'Content-Type': 'application/json'
          }
        });
        
        if (response.ok) {
          const data = await response.json();
          if (data.error) {
            showStatus(`Proxy error: ${data.error}`, 'error');
          } else {
            showStatus('✓ Proxy connection successful!', 'success');
          }
        } else {
          showStatus(`Proxy error: HTTP ${response.status}`, 'error');
        }
      } catch (error) {
        showStatus(`Connection failed: ${error.message}`, 'error');
      }
    }

    // ==================== INITIALIZATION ====================
    document.addEventListener('DOMContentLoaded', function() {
      loadApiSettings();
      setupCategoryNavigation();
      fillCells(farmingItems);
    });
    
  </script>
</body>
</html>
