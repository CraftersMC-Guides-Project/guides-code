<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="assets/cmc-icon.png" type="image/png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Category Items</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="js/api-proxy-client.js"></script>
  <link rel="stylesheet" href="css/categories.css">
  <link rel="stylesheet" href="css/essential.css">
  <style>
      /* Special style for Sky Canvas image only */
      img[alt="Sky Canvas"] { filter: brightness(90%) saturate(95%); }
      #top-right-ui-container { position: fixed; top: 80px; right: 20px; z-index: 1001; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
      .profile-card { display: flex; align-items: center; gap: 10px; background-color: rgba(0, 0, 0, 0.5); padding: 8px 12px; border-radius: 50px; color: white; text-decoration: none; transition: background-color 0.3s; }
      .profile-card:hover { background-color: rgba(0, 0, 0, 0.8); }
      .profile-card-avatar { width: 32px; height: 32px; border-radius: 50%; }
      .profile-card-name { font-weight: 500; font-size: 14px; }
      .dev-label { color: #ff4d4d; font-weight: bold; margin-left: 5px; }
      .login-btn { background-color: #5865F2; color: white; padding: 10px 15px; border-radius: 8px; text-decoration: none; font-weight: 500; display: flex; align-items: center; gap: 8px; }
      .private-item-highlight { border: 2px dashed #ff9800; background-color: rgba(255, 152, 0, 0.1); padding: 10px; border-radius: 10px; margin-bottom: 10px; }
      @media (max-width: 768px) { #top-right-ui-container { top: 65px; right: 10px; gap: 8px; } .profile-card { padding: 4px 8px; } .profile-card-avatar { width: 28px; height: 28px; } .profile-card-name { font-size: 12px; } }
  </style>
  <script src="js/script.js"></script>
</head>
<body>
  <div id="loader"><div></div><div></div><div></div></div>
  <div class="market-background"></div>
  <div id="top-right-ui-container"><div id="profile-card-container"></div></div>
  <div class="top"></div>
  <div class="sidebar" id="sidebar"></div>
  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
  <span class="material-icons" id="scrollToTopBtn">north</span>
  <div class="gap"></div>

  <div id="categoryFilter" style="display: flex; gap: 12px; justify-content: center; margin: 5rem 0; flex-wrap: wrap;">
    <button class="btn cat-filter-btn active" data-nature="all" style="padding: 12px 24px;">All</button>
    <button class="btn cat-filter-btn" data-nature="stable" style="padding: 12px 24px;">Stable</button>
    <button class="btn cat-filter-btn" data-nature="overpaid" style="padding: 12px 24px;">Overpaid</button>
    <button class="btn cat-filter-btn" data-nature="underpaid" style="padding: 12px 24px;">Underpaid</button>
  </div>

  <div id="categoryItems">
      <p>Loading items...</p>
  </div>

  <div id="footer"></div>

  <script>
      let isDevUser = false;
      let apiClient = new APIProxyClient();

      function getCookie(name) {
          const value = `; ${document.cookie}`;
          const parts = value.split(`; ${name}=`);
          if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
          return '';
      }

      async function loadProfileCard() {
          const storedUser = getCookie("discordUser");
          const profileContainer = document.getElementById("profile-card-container");
          let devIds = [];
          try { const response = await fetch('/devs.txt'); if (response.ok) { const text = await response.text(); devIds = text.split('\n').map(id => id.trim()).filter(id => id); } } catch (error) {}
          if (storedUser) { const user = JSON.parse(storedUser); const displayName = user.global_name || user.username; isDevUser = devIds.includes(user.id);
              profileContainer.innerHTML = `<a href="/profile" class="profile-card"><img src="https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png" class="profile-card-avatar"><span class="profile-card-name">${displayName}${isDevUser ? '<span class="dev-label">[DEV]</span>' : ''}</span></a>`; } else { profileContainer.innerHTML = ''; }
      }

      async function loadCategoryItems() {
          const urlParams = new URLSearchParams(window.location.search);
          const category = urlParams.get('cat');

          if (!category) {
              document.getElementById('categoryItems').innerHTML = '<p>No category specified.</p>';
              return;
          }

          try {
              const [marketRes, pricesRes] = await Promise.all([
                  fetch('market/market.txt'),
                  fetch('market/mprices.txt')
              ]);

              const marketData = await marketRes.json();
              const pricesData = await pricesRes.text();

              // Store all items for filtering
              window._allCategoryItems = marketData.filter(item =>
                  item.category && item.category.toLowerCase() === category.toLowerCase()
              );
              renderCategoryItems('all');
          } catch (error) {
              console.error('Error loading category items:', error);
              document.getElementById('categoryItems').innerHTML = '<p>Failed to load items.</p>';
          }
      }

      function renderCategoryItems(natureFilter) {
          const items = window._allCategoryItems || [];
          let filtered = items;
          if (natureFilter && natureFilter !== 'all') {
              filtered = items.filter(item => {
                  if (!item.nature) return false;
                  if (natureFilter === 'stable') return item.nature.toUpperCase().includes('STABLE');
                  if (natureFilter === 'overpaid') return item.nature.toUpperCase().includes('OVERPAID');
                  if (natureFilter === 'underpaid') return item.nature.toUpperCase().includes('UNDERPAID');
                  return false;
              });
          }

          const urlParams = new URLSearchParams(window.location.search);
          const currentCategory = urlParams.get('cat');
          const currentNature = natureFilter || 'all';

          const visibleItems = filtered.filter(item => {
              const isPublic = item.hasOwnProperty('public') ? item.public : true;
              if (!isPublic && !isDevUser) return false;
              return true;
          });

          if (visibleItems.length > 0) {
              // Render items with async bazaar data fetching - only show items that exist in bazaar API
              const renderItemsWithBazaarData = async () => {
                  // Show loading state
                  document.getElementById('categoryItems').innerHTML = '<p>Loading bazaar items...</p>';
                  
                  const itemsHTMLPromises = visibleItems.map(async (item) => {
                      const isPublic = item.hasOwnProperty('public') ? item.public : true;
                      const isSkyCanvas = item.name === "Sky Canvas";
                      let privateHighlight = (!isPublic && isDevUser) ? `<div class='private-item-highlight'>PRIVATE ITEM (Visible only to Devs)</div>` : '';
                      
                      // Fetch bazaar data for this item - only include if it exists in bazaar API
                      let bazaarData = null;
                      try {
                          bazaarData = await fetchBazaarData(item.id);
                          // Check if item exists in bazaar API
                          // Item exists if we have valid bazaar data with buy/sell entries
                          if (!bazaarData || 
                              !bazaarData.buyTopEntries || 
                              !bazaarData.sellTopEntries ||
                              bazaarData.error) {
                              // Item doesn't exist in bazaar API, return null to filter it out
                              return null;
                          }
                      } catch (error) {
                          // API error means item doesn't exist in bazaar, filter it out
                          console.log(`Item ${item.id} not found in bazaar API:`, error.message);
                          return null;
                      }
                      
                      // Item exists in bazaar API, render it
                      let bazaarPriceHTML = '';
                      if (bazaarData && bazaarData.sellTopEntries && bazaarData.sellTopEntries[0]) {
                          const sellPrice = bazaarData.sellTopEntries[0].price || 0;
                          bazaarPriceHTML = `<p class="category-price"><strong>Bazaar Price:</strong> ${formatCurrency(sellPrice)}</p>`;
                      }
                      
                      return `
                          <div class="category-item-card" onclick="window.location.href='item.html?item=${item.id}&cat=${encodeURIComponent(currentCategory)}&nature=${encodeURIComponent(currentNature)}'">
                              ${privateHighlight}
                              <h2>${item.name}</h2>
                              ${item.picture ? `<div class="category-main-data"><img src="${item.picture}" alt="${item.name}"${isSkyCanvas ? ' class="category-sky-canvas-img"' : ''}>` : ''}
                              <div class="category-main-data-val"><p><strong>ID:</strong> ${item.id}</p>
                              ${bazaarPriceHTML}
                              ${item.description ? `<p class="category-description">${item.description}</p>` : ''}
                              ${item.rarity ? `<p class="category-rarity-display"><img class="category-rarity" src="img/rarity/${item.rarity}.webp"></p><br><br>` : ''}
                              ${item.nature ? `<p class="category-nature"><strong>Nature:</strong> ${formatNature(item.nature)}</p>` : ''}
                              ${item.demand ? `<p class="category-demand"><strong>Demand:</strong> ${formatDemand(item.demand)}</p>` : ''}
                              </div></div>
                          </div>
                      `;
                  });
                  
                  const itemsHTMLResults = await Promise.all(itemsHTMLPromises);
                  // Filter out null values (items that don't exist in bazaar API)
                  const itemsHTML = itemsHTMLResults.filter(html => html !== null);
                  
                  if (itemsHTML.length > 0) {
                      document.getElementById('categoryItems').innerHTML = `<div class="category-item-list">${itemsHTML.join('')}</div>`;
                  } else {
                      document.getElementById('categoryItems').innerHTML = '<p>No bazaar items found in this category.</p>';
                  }
              };
              
              renderItemsWithBazaarData();
          } else {
              document.getElementById('categoryItems').innerHTML = '<p>No items found in this category.</p>';
          }
      }

      function formatNature(nature) {
          let natureText = nature.replace('[', ' ').toLowerCase();
          natureText = natureText.replace(']', '').replace(/_/g, ' ').trim();
          return natureText;
      }

      function formatDemand(demand) {
          let demandText = demand.replace('[', ' ').toLowerCase();
          demandText = demandText.replace(']', '').replace(/_/g, ' ').trim();
          return demandText;
      }

      function formatCurrency(amount) {
          if (amount === undefined || amount === null) return 'N/A';
          if (amount >= 1000000) return (amount / 1000000).toFixed(2) + 'M';
          if (amount >= 1000) return (amount / 1000).toFixed(1) + 'K';
          return Math.round(amount).toLocaleString();
      }

      async function fetchBazaarData(itemId) {
          try {
              const data = await apiClient.getBazaarItem(itemId);
              // Check if the API returned an error or invalid data
              if (data && data.error) {
                  return null;
              }
              return data;
          } catch (error) {
              // Item doesn't exist in bazaar API
              return null;
          }
      }

      document.addEventListener('DOMContentLoaded', function() {
          loadProfileCard();
          loadCategoryItems();
          document.getElementById('categoryFilter').addEventListener('click', function(e) {
              if (e.target.classList.contains('cat-filter-btn')) {
                  document.querySelectorAll('.cat-filter-btn').forEach(btn => btn.classList.remove('active'));
                  e.target.classList.add('active');
                  renderCategoryItems(e.target.getAttribute('data-nature'));
              }
          });
      });
  </script>
</body>
</html>
