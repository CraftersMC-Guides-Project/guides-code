<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" href="assets/cmc-icon.png" type="image/png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auction House - CraftersMC Guides</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <script src="js/script.js"></script>
  <link rel="stylesheet" href="css/essential.css" />
  <style>
    html,
    body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background-color: #1a1a2e;
    }

    .auction-wrapper {
      display: flex;
      justify-content: center;
      padding: 24px 12px 48px;
    }

    .container {
      display: grid;
      grid-template-columns: 2px 2px auto 2px 2px;
      grid-template-rows: 2px 2px auto 2px 2px;
      grid-template-areas:
        "tl-tl tr-tl t tl-tr tr-tr"
        "bl-tl br-tl t bl-tr br-tr"
        "l l inv r r"
        "tl-bl tr-bl b tl-br tr-br"
        "bl-bl br-bl b bl-br br-br";
    }

    .s-br {
      box-shadow: 2px 0 0 black, 0 2px 0 black;
    }

    .s-bl {
      box-shadow: -2px 0 0 black, 0 2px 0 black;
    }

    .s-tr {
      box-shadow: 0 -2px 0 black, 2px 0 0 black;
    }

    .s-tl {
      box-shadow: 0 -2px 0 black, -2px 0 0 black;
    }

    .corner-top {
      grid-area: t;
      box-shadow: 0 -2px 0 black;
      background-color: #ffffff;
    }

    .corner-left {
      grid-area: l;
      box-shadow: -2px 0 0 black;
      background-color: #ffffff;
    }

    .corner-right {
      grid-area: r;
      box-shadow: 2px 0 0 black;
      background-color: #555555;
    }

    .corner-bottom {
      grid-area: b;
      box-shadow: 0 2px 0 black;
      background-color: #555555;
    }

    .inner-container {
      background-color: #c6c6c6;
      grid-area: inv;
      grid-column: inherit;
    }

    .tl-tl {
      grid-area: tl-tl;
      background-color: #ffffff;
      position: relative;
      bottom: -4px;
      right: -4px;
    }

    .br-br {
      grid-area: br-br;
      background-color: #555555;
      position: relative;
      top: -4px;
      left: -4px;
    }

    .bl-tl,
    .tr-tl,
    .br-tl {
      background-color: #ffffff;
    }

    .bl-tl {
      grid-area: bl-tl;
    }

    .tr-tl {
      grid-area: tr-tl;
    }

    .br-tl {
      grid-area: br-tl;
    }

    .bl-tr {
      grid-area: bl-tr;
      background-color: #c6c6c6;
    }

    .tr-bl {
      grid-area: tr-bl;
      background-color: #c6c6c6;
    }

    .tr-br,
    .tl-br,
    .bl-br {
      background-color: #555555;
    }

    .tr-br {
      grid-area: tr-br;
    }

    .tl-br {
      grid-area: tl-br;
    }

    .bl-br {
      grid-area: bl-br;
    }

    .inventory {
      padding: 0.4rem;
      display: grid;
    }

    .inventory .inner-container {
      display: grid;
      grid-column: inherit;
    }

    .inner-container h3 {
      margin: 0 auto 8px auto;
      font-size: 1.2rem;
      color: #333;
      text-align: center;
    }

    .extreme-inner-container {
      color: #262626;
      display: grid;
      grid-template-columns: repeat(9, auto);
      grid-template-rows: repeat(4, auto);
    }

    .hotbar-controls {
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .cell {
      box-shadow: inset 2px 2px 0 0 #373737, inset -2px -2px 0 0 #ffffff;
      background-color: #8b8b8b;
      height: 2rem;
      width: 2rem;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cell img {
      height: 1.5rem;
      width: 1.5rem;
      margin: 0.25rem;
      image-rendering: pixelated;
    }

    .item-with-sub {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .tooltip {
      position: absolute;
      left: 110%;
      top: 0;
      background: #2d143b;
      color: #ffe16b;
      border: 2px solid #4b267a;
      border-radius: 6px;
      padding: 12px;
      z-index: 100;
      min-width: 250px;
      font-family: 'Minecraft', 'Arial', sans-serif;
      font-size: 0.85rem;
      box-shadow:
        0 0 0 2px #4b267a,
        -4px -4px 0 0 #fff,
        4px -4px 0 0 #fff,
        -4px 4px 0 0 #555,
        4px 4px 0 0 #555;
      font-weight: bold;
      display: none;
      white-space: normal;
    }

    .mc-frame {
      position: relative;
      padding: 10px;
      background: linear-gradient(#1a0f1f, #120915);
      color: #dcdcdc;
      font-size: 14px;
      line-height: 1.3;
    }

    .mc-corner {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #4b267a;
    }

    .mc-corner.tl {
      top: -2px;
      left: -2px;
    }

    .mc-corner.tr {
      top: -2px;
      right: -2px;
    }

    .mc-corner.bl {
      bottom: -2px;
      left: -2px;
    }

    .mc-corner.br {
      bottom: -2px;
      right: -2px;
    }

    .mc-edge {
      position: absolute;
      background: #4b267a;
    }

    .mc-edge.top {
      top: -2px;
      left: 2px;
      right: 2px;
      height: 2px;
    }

    .mc-edge.bottom {
      bottom: -2px;
      left: 2px;
      right: 2px;
      height: 2px;
    }

    .mc-edge.left {
      left: -2px;
      top: 2px;
      bottom: 2px;
      width: 2px;
    }

    .mc-edge.right {
      right: -2px;
      top: 2px;
      bottom: 2px;
      width: 2px;
    }

    .mc-content {
      color: #ffe16b;
    }

    .mc-content.loading {
      color: #ffd700;
      font-style: italic;
    }

    .mc-content .title {
      color: #6d5cff;
      font-weight: bold;
      font-size: 1.1rem;
      display: block;
      margin-bottom: 8px;
    }

    .mc-content .rarity {
      color: #55ff55;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .mc-content .spacer {
      height: 6px;
    }

    .mc-content .row {
      display: flex;
      gap: 4px;
      margin-bottom: 4px;
      font-size: 12px;
    }

    .mc-content .gold {
      color: #ffaa00;
    }

    .mc-content {
      color: #ffe16b;
    }

    .mc-content.loading {
      color: #ffd700;
      font-style: italic;
    }

    .mc-content .title {
      color: #6d5cff;
      font-weight: bold;
      font-size: 1.1rem;
      display: block;
      margin-bottom: 8px;
    }

    .mc-content .rarity {
      color: #55ff55;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .mc-content .spacer {
      height: 6px;
    }

    .mc-content .row {
      display: flex;
      gap: 4px;
      margin-bottom: 4px;
      font-size: 12px;
    }

    .mc-content .gold {
      color: #ffaa00;
    }

    .ah-search {
      display: flex;
      align-items: center;
      gap: 6px;
      box-sizing: border-box;
    }

    .ah-btn {
      cursor: pointer;
      border: 0;
      padding: 2px;
      font: inherit;
      color: #262626;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: none;
    }

    .ah-btn:hover {
      box-shadow: none;
      background: transparent;
      transform: none;
    }

    .ah-btn:focus-visible {
      outline: 2px solid #ffff55;
      outline-offset: 2px;
    }

    .ah-icon {
      width: 24px;
      height: 24px;
      image-rendering: pixelated;
      user-select: none;
      pointer-events: none;
    }

    .ah-search-input {
      width: 240px;
      height: 28px;
      border: 0;
      outline: 0;
      background: rgba(0, 0, 0, 0.15);
      box-shadow: inset 2px 2px 0 0 #373737, inset -2px -2px 0 0 #ffffff;
      color: #262626;
      font-size: 0.95rem;
      padding: 0 8px;
      box-sizing: border-box;
      transition: width 120ms ease, padding 120ms ease, opacity 120ms ease;
    }

    .ah-search:not(.ah-search--open) .ah-search-input {
      width: 0;
      padding: 0;
      opacity: 0;
      pointer-events: none;
    }

    .ah-search-input::placeholder {
      color: #3a3a3a;
      opacity: 0.85;
    }

    .ah-badge {
      position: absolute;
      right: -2px;
      bottom: -2px;
      font-size: 10px;
      line-height: 1;
      padding: 2px 3px;
      background: rgba(0, 0, 0, 0.45);
      color: #ffffff;
      border-radius: 2px;
      user-select: none;
      pointer-events: none;
    }

    .cell::before,
    .cell::after {
      content: "";
      height: 2px;
      width: 2px;
      background-color: #8b8b8b;
      position: absolute;
      top: 0;
      right: 0;
    }

    .cell::after {
      top: auto;
      right: auto;
      left: 0;
      bottom: 0;
    }
  </style>
</head>

<body>
  <div id="loader"></div>

  <!-- Top Navbar -->
  <div class="top"></div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar"></div>
  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <div class="gap"></div>

  <div class="auction-wrapper">
    <div class="container">
      <div class="corner-left"></div>
      <div class="corner-right"></div>
      <div class="corner-bottom"></div>
      <div class="corner-top"></div>
      <div class="tl-tl"></div>
      <div class="tr-tl s-tl"></div>
      <div class="bl-tl s-tl"></div>
      <div class="br-tl"></div>
      <div class="tr-bl s-bl"></div>
      <div class="bl-tr s-tr"></div>
      <div class="tl-br"></div>
      <div class="tr-br s-br"></div>
      <div class="bl-br s-br"></div>
      <div class="br-br"></div>

      <div class="inventory inner-container">
        <h3>Auction House</h3>
        <div class="extreme-inner-container" id="mainGrid"></div>
        <div class="hotbar-controls" id="hotbarGrid" aria-label="Auction filters">
          <div class="ah-search" id="ahSearch" title="Search - Search items by their names or descriptions">
            <button class="ah-btn" id="ahSearchToggle" type="button" aria-label="Search" aria-expanded="false"
              aria-controls="ahSearchInput">
              <img class="ah-icon" src="assets/ah/search.png" alt="" />
            </button>
            <input class="ah-search-input" id="ahSearchInput" type="search" placeholder="Search..." autocomplete="off"
              spellcheck="false" />
          </div>

          <button class="ah-btn" id="ahAuctionTypeBtn" type="button"
            title="Auction Type - Buy It Now, Classic Auction, or Both" aria-label="Auction Type">
            <img class="ah-icon" id="ahAuctionTypeIcon" src="assets/ah/auction_type/show_all.png" alt="" />
          </button>

          <button class="ah-btn" id="ahRarityBtn" type="button" title="Item Rarity - Can be switched between rarities"
            aria-label="Item Rarity">
            <img class="ah-icon" id="ahRarityIcon" src="assets/ah/rarities/notier.png" alt="" />
          </button>

          <button class="ah-btn" id="ahSortBtn" type="button"
            title="Sorting - Highest/lowest bid/price, ending soon, most bids, highest rarity, random"

  </div>

  <div id="footer"></div>

  <script src="js/api-proxy-client.js"></script>

  <script>
    const apiClient = new APIProxyClient();
    let auctionCache = new Map();
    let currentAuctions = [];
    let filteredAuctions = [];
    let currentPage = 0;

    // Cache and state management
    function readSessionCache(auctionId) {
      try {
        const cached = sessionStorage.getItem(`auction_${auctionId}`);
        return cached ? JSON.parse(cached) : null;
      } catch {
        return null;
      }
    }

    function writeSessionCache(auctionId, data) {
      try {
        sessionStorage.setItem(`auction_${auctionId}`, JSON.stringify(data));
      } catch (e) {
        console.warn('Failed to write auction cache:', e);
      }
    }

    // Format currency
    function formatCurrency(amount) {
      if (amount === undefined || amount === null) return 'N/A';
      const truncated = Math.trunc(Number(amount) * 100) / 100;
      const hasDecimals = Math.abs(truncated % 1) > Number.EPSILON;
      return truncated.toLocaleString(undefined, {
        minimumFractionDigits: hasDecimals ? 2 : 0,
        maximumFractionDigits: 2
      });
    }

    // Format number
    function formatNumber(num) {
      if (num === undefined || num === null) return 'N/A';
      return num.toLocaleString();
    }

    // Format time remaining
    function formatTimeRemaining(endTime) {
      if (!endTime) return 'N/A';
      const now = Date.now();
      const diff = endTime - now;
      if (diff <= 0) return 'Ended';
      const mins = Math.floor(diff / 60000);
      const hours = Math.floor(mins / 60);
      const days = Math.floor(hours / 24);
      if (days > 0) return `${days}d ${hours % 24}h`;
      if (hours > 0) return `${hours}h ${mins % 60}m`;
      return `${mins}m`;
    }

    // Get auction type label
    function getAuctionTypeLabel(isBin) {
      return isBin ? 'BIN' : 'Auction';
    }

    // Map rarity to icon
    function getRarityIcon(rarity) {
      const rarityMap = {
        'common': 'assets/ah/rarities/common.png',
        'uncommon': 'assets/ah/rarities/uncommon.png',
        'rare': 'assets/ah/rarities/rare.png',
        'epic': 'assets/ah/rarities/epic.png',
        'legendary': 'assets/ah/rarities/legendary.png',
        'mythic': 'assets/ah/rarities/mythic.png',
        'special': 'assets/ah/rarities/special.png',
        'notier': 'assets/ah/rarities/notier.png'
      };
      return rarityMap[(rarity || 'common').toLowerCase()] || 'assets/ah/rarities/notier.png';
    }

    // Generate possible image paths for an item name
    function generateImagePaths(itemName) {
      if (!itemName || typeof itemName !== 'string') {
        return ['assets/ah/search.png'];
      }

      const paths = [];
      const original = itemName.trim();

      // 1. Original name with spaces → underscores (preserves case)
      const originalSlug = original.replace(/\s+/g, '_');
      if (originalSlug) {
        paths.push(`img/${originalSlug}.webp`);
        paths.push(`img/${originalSlug}.png`);
      }

      // 2. Lowercased version (your existing slug)
      const lowerSlug = original.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_-]/g, '');
      if (lowerSlug && lowerSlug !== originalSlug) {
        paths.push(`img/${lowerSlug}.webp`);
        paths.push(`img/${lowerSlug}.png`);
      }

      // 3. First word (preserving case)
      const firstWord = original.split(/\s+/)[0];
      if (firstWord) {
        paths.push(`img/${firstWord}.webp`);
        paths.push(`img/${firstWord}.png`);
        const lowerFirst = firstWord.toLowerCase();
        if (lowerFirst !== firstWord) {
          paths.push(`img/${lowerFirst}.webp`);
          paths.push(`img/${lowerFirst}.png`);
        }
      }

      // 4. Ultimate fallback
      paths.push('assets/ah/search.png');

      return paths;
    }

    // Try loading next image path if previous failed
    function setupImageFallback(imgElement) {
      const paths = JSON.parse(imgElement.dataset.imagePaths || '[]');
      let currentIndex = 0;

      // Set initial src to first path
      if (paths.length > 0) {
        imgElement.src = paths[0];
        currentIndex = 1;
      }

      imgElement.addEventListener('error', () => {
        if (currentIndex < paths.length) {
          const nextPath = paths[currentIndex];
          console.log(`[Auction] Image failed: ${imgElement.src}, trying: ${nextPath}`);
          imgElement.src = nextPath;
          currentIndex++;
        } else {
          console.warn(`[Auction] All image paths failed for item: ${imgElement.dataset.itemName}`);
        }
      }, { once: false });
    }

    // Format enchantments from NBT
    function formatEnchantments(decoded) {
      const enchants = decoded?.tag?.Enchantments || decoded?.Enchantments;
      if (!enchants || !Array.isArray(enchants)) return '';

      return enchants.map(e => {
        const name = e.id?.replace(/^minecraft:/, '').split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        const level = e.lvl || e.level;
        return `<div class="row"><span>${name}</span><span class="gold">${level}</span></div>`;
      }).join('');
    }

    // Format lore lines
    function formatLore(decoded) {
      const lore = decoded?.tag?.display?.Lore || decoded?.display?.Lore;
      if (!lore || !Array.isArray(lore)) return '';
      return lore.map(line => `<div class="row muted">${cleanMCText(line)}</div>`).join('');
    }

    // Clean Minecraft colour codes and JSON text components
    function cleanMCText(text) {
      if (!text) return '';
      let cleaned = text;
      if (cleaned.startsWith('{')) {
        try {
          const parsed = JSON.parse(cleaned);
          cleaned = parsed.text || parsed.extra?.map(e => e.text).join('') || cleaned;
        } catch (e) { }
      }
      return cleaned.replace(/§./g, '');
    }

    // Extract numeric stats (damage, strength, etc.) from NBT
    function extractItemStats(decoded) {
      const stats = [];
      const attackDamage = decoded?.tag?.AttributeModifiers?.find(m => m.AttributeName === 'generic.attackDamage')?.Amount;
      if (attackDamage) stats.push(`Damage: +${attackDamage}`);
      const strength = decoded?.tag?.ExtraAttributes?.strength;
      if (strength) stats.push(`Strength: +${strength}`);
      const defense = decoded?.tag?.ExtraAttributes?.defense;
      if (defense) stats.push(`Defense: +${defense}`);
      // Add more as needed
      return stats.map(s => `<div class="row"><span>${s}</span></div>`).join('');
    }

    // Fill grid with auctions
    async function fillCells(auctions) {
      const mainGrid = document.getElementById('mainGrid');
      if (!mainGrid) {
        console.warn('[Auction] mainGrid element not found');
        return;
      }

      console.log(`[Auction] Filling grid with ${auctions.length} auctions`);
      mainGrid.innerHTML = '';

      for (let i = 0; i < 36; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';

        if (i < auctions.length) {
          const auction = auctions[i];
          const itemName = auction.item_name || 'Unknown Item';

          // Generate image filename from item name
          // Try multiple variations to find the image
          const imagePaths = generateImagePaths(itemName);
          const primaryImage = imagePaths[0];

          console.log(`[Auction] Added item ${i + 1}: ${itemName} (ID: ${auction.uuid})`);
          console.log(`[Auction] Trying image paths:`, imagePaths);

          cell.innerHTML = `
            <div class="item-with-sub">
              <img src="${primaryImage}" alt="${itemName}" 
                   class="item-img"
                   data-item-name="${itemName}"
                   data-image-paths='${JSON.stringify(imagePaths).replace(/'/g, "&apos;")}'>
              <div class="tooltip">
                <div class="mc-frame">
                  <div class="mc-corner tl"></div>
                  <div class="mc-corner tr"></div>
                  <div class="mc-corner bl"></div>
                  <div class="mc-corner br"></div>
                  <div class="mc-edge top"></div>
                  <div class="mc-edge bottom"></div>
                  <div class="mc-edge left"></div>
                  <div class="mc-edge right"></div>
                  <div class="mc-content loading">Loading auction data...</div>
                </div>
              </div>
            </div>
          `;

          setupAuctionTooltip(cell, auction);
        }

        mainGrid.appendChild(cell);
      }
    }

    // Setup tooltip for auction cell
    function setupAuctionTooltip(cell, auction) {
      const itemDiv = cell.querySelector('.item-with-sub');
      const tooltip = itemDiv?.querySelector('.tooltip');
      const contentBox = tooltip?.querySelector('.mc-content');
      const imgElement = itemDiv?.querySelector('.item-img');

      if (!itemDiv || !tooltip || !contentBox) {
        console.warn('[Auction] Failed to setup tooltip for auction:', auction.uuid);
        return;
      }

      // Setup image fallback for trying multiple paths
      if (imgElement) {
        setupImageFallback(imgElement);
      }

      let timeout;

      itemDiv.addEventListener('mouseenter', () => {
        console.log(`[Auction] Hover enter: ${auction.item_name}`);
        clearTimeout(timeout);

        timeout = setTimeout(async () => {
          tooltip.style.display = 'block';
          contentBox.className = 'mc-content loading';
          contentBox.innerHTML = 'Loading auction details...';

          const html = generateAuctionTooltipHTML(auction);
          contentBox.className = 'mc-content';
          contentBox.innerHTML = html;
          console.log(`[Auction] Tooltip loaded for: ${auction.item_name}`);
        }, 150);
      });

      itemDiv.addEventListener('mouseleave', () => {
        console.log(`[Auction] Hover leave: ${auction.item_name}`);
        clearTimeout(timeout);
        tooltip.style.display = 'none';
      });
    }

    // Generate tooltip HTML for auction
    function generateAuctionTooltipHTML(auction) {
      const itemName = auction.item_name || 'Unknown Item';
      const rarity = (auction.tier || 'common').toUpperCase();
      const auctionType = auction.bin ? 'BIN' : 'Auction';
      const endTime = auction.end_time * 1000;

      // Start with Minecraft frame content
      let html = `<div class="title">${itemName}</div>`;
      html += `<div class="rarity">${rarity}</div>`;

      // Add item stats from NBT
      const decoded = auction.item_nbt_decoded?.decoded;
      if (decoded) {
        const statsHtml = extractItemStats(decoded);
        if (statsHtml) html += `<div class="spacer"></div>${statsHtml}`;

        const enchantsHtml = formatEnchantments(decoded);
        if (enchantsHtml) {
          html += `<div class="spacer"></div><div class="row gold">Enchantments</div>${enchantsHtml}`;
        }

        const loreHtml = formatLore(decoded);
        if (loreHtml) {
          html += `<div class="spacer"></div><div class="row muted">Lore</div>${loreHtml}`;
        }
      }

      // Auction details
      html += `<div class="spacer"></div>`;
      html += `<div class="row"><span>Type:</span><span>${auctionType}</span></div>`;

      if (auction.bin) {
        html += `<div class="row"><span>BIN Price:</span><span class="gold">${formatCurrency(auction.bin_price)}</span></div>`;
      } else {
        html += `<div class="row"><span>Starting Bid:</span><span class="gold">${formatCurrency(auction.starting_bid)}</span></div>`;
        html += `<div class="row"><span>Highest Bid:</span><span class="gold">${formatCurrency(auction.highest_bid_amount)}</span></div>`;
        html += `<div class="row"><span>Bids:</span><span>${formatNumber(auction.bid_count)}</span></div>`;
      }

      html += `<div class="row"><span>Seller:</span><span>${auction.auctioneer || 'Unknown'}</span></div>`;
      html += `<div class="row"><span>Ends in:</span><span class="gold">${formatTimeRemaining(endTime)}</span></div>`;

      return html;
    }

    // Apply filters to auctions
    function applyFilters() {
      const searchText = document.getElementById('ahSearchInput').value.toLowerCase().trim();
      const auctionType = document.querySelector('input[name="auctionType"][checked]')?.value || 'both';
      const rarity = document.querySelector('input[name="rarity"][checked]')?.value || 'all';
      const sortBy = document.querySelector('input[name="sort"][checked]')?.value || 'highest';

      console.log(`[Auction] Applying filters - Search: "${searchText}", Type: ${auctionType}, Rarity: ${rarity}, Sort: ${sortBy}`);

      filteredAuctions = currentAuctions.filter(auction => {
        // Search filter
        if (searchText && !auction.item_name?.toLowerCase().includes(searchText)) {
          return false;
        }

        // Auction type filter
        if (auctionType === 'bin' && !auction.bin) return false;
        if (auctionType === 'auction' && auction.bin) return false;

        // Rarity filter
        if (rarity !== 'all' && auction.tier?.toLowerCase() !== rarity.toLowerCase()) {
          return false;
        }

        return true;
      });

      console.log(`[Auction] Filtered to ${filteredAuctions.length} auctions from ${currentAuctions.length} total`);

      // Apply sorting
      sortAuctions(filteredAuctions, sortBy);
      fillCells(filteredAuctions);
    }

    // Sort auctions
    function sortAuctions(auctions, sortBy) {
      console.log(`[Auction] Sorting ${auctions.length} auctions by: ${sortBy}`);
      const now = Date.now();

      switch (sortBy) {
        case 'highest':
          auctions.sort((a, b) => {
            const priceA = a.bin ? (a.bin_price || 0) : (a.highest_bid_amount || 0);
            const priceB = b.bin ? (b.bin_price || 0) : (b.highest_bid_amount || 0);
            return priceB - priceA;
          });
          break;
        case 'lowest':
          auctions.sort((a, b) => {
            const priceA = a.bin ? (a.bin_price || 0) : (a.highest_bid_amount || 0);
            const priceB = b.bin ? (b.bin_price || 0) : (b.highest_bid_amount || 0);
            return priceA - priceB;
          });
          break;
        case 'ending':
          auctions.sort((a, b) => {
            const timeA = (a.end_time || 0) * 1000;
            const timeB = (b.end_time || 0) * 1000;
            return timeA - timeB;
          });
          break;
        case 'bids':
          auctions.sort((a, b) => (b.bid_count || 0) - (a.bid_count || 0));
          break;
        case 'rarity':
          const rarityOrder = { mythic: 7, legendary: 6, epic: 5, rare: 4, uncommon: 3, common: 2, special: 1 };
          auctions.sort((a, b) => {
            const rarityA = rarityOrder[a.tier?.toLowerCase()] || 0;
            const rarityB = rarityOrder[b.tier?.toLowerCase()] || 0;
            return rarityB - rarityA;
          });
          break;
        case 'random':
          for (let i = auctions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [auctions[i], auctions[j]] = [auctions[j], auctions[i]];
          }
          break;
      }
      console.log(`[Auction] Sort completed, top item: ${auctions[0]?.item_name || 'N/A'}`);
    }

    // Load auctions from API
    async function loadAuctions(page = 0) {
      console.log(`[Auction] Loading auctions from page ${page}`);
      try {
        const data = await apiClient.getAuctions(page);
        console.log(`[Auction] API Response:`, data);

        if (data.auctions && Array.isArray(data.auctions)) {
          currentAuctions = data.auctions;
          currentPage = page;
          console.log(`[Auction] Loaded ${currentAuctions.length} auctions`);
          // Log first auction structure for debugging
          if (currentAuctions.length > 0) {
            console.log(`[Auction] First auction structure:`, currentAuctions[0]);
            console.log(`[Auction] Available fields:`, Object.keys(currentAuctions[0]));
          }
          applyFilters();
        } else {
          console.error('[Auction] Invalid auctions response format:', data);
          fillCells([]);
        }
      } catch (error) {
        console.error('[Auction] Failed to load auctions:', error);
        // Fallback to empty grid
        fillCells([]);
      }
    }

    function fillEmptyGrid() {
      const mainGrid = document.getElementById('mainGrid');
      if (!mainGrid) return;

      mainGrid.innerHTML = '';

      for (let i = 0; i < 36; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        mainGrid.appendChild(cell);
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      console.log('[Auction] DOMContentLoaded - Initializing auction house');
      fillEmptyGrid();
      loadAuctions(0);
    });

    (function initAuctionFilters() {
      console.log('[Auction] Initializing auction filters');
      const searchWrap = document.getElementById('ahSearch');
      const searchToggle = document.getElementById('ahSearchToggle');
      const searchInput = document.getElementById('ahSearchInput');
      const auctionTypeBtn = document.getElementById('ahAuctionTypeBtn');
      const auctionTypeIcon = document.getElementById('ahAuctionTypeIcon');
      const rarityBtn = document.getElementById('ahRarityBtn');
      const rarityIcon = document.getElementById('ahRarityIcon');
      const sortBtn = document.getElementById('ahSortBtn');

      if (!searchWrap || !searchToggle || !searchInput || !auctionTypeBtn || !auctionTypeIcon || !rarityBtn || !rarityIcon || !sortBtn) {
        console.error('[Auction] Failed to find required filter elements');
        return;
      }

      console.log('[Auction] Filter elements found, setting up event listeners');

      const auctionTypeOptions = [
        { key: 'both', label: 'Both', icon: 'assets/ah/auction_type/show_all.png' },
        { key: 'bin', label: 'BIN', icon: 'assets/ah/auction_type/bin_only.png' },
        { key: 'auction', label: 'Auc', icon: 'assets/ah/auction_type/auction_only.png' },
      ];

      const rarityOptions = [
        { key: 'all', label: 'All', icon: 'assets/ah/rarities/notier.png' },
        { key: 'common', label: 'Com', icon: 'assets/ah/rarities/common.png' },
        { key: 'uncommon', label: 'Unc', icon: 'assets/ah/rarities/uncommon.png' },
        { key: 'rare', label: 'Rare', icon: 'assets/ah/rarities/rare.png' },
        { key: 'epic', label: 'Epic', icon: 'assets/ah/rarities/epic.png' },
        { key: 'legendary', label: 'Leg', icon: 'assets/ah/rarities/legendary.png' },
        { key: 'mythic', label: 'Myth', icon: 'assets/ah/rarities/mythic.png' },
        { key: 'special', label: 'Spec', icon: 'assets/ah/rarities/special.png' },
      ];

      const sortOptions = [
        { key: 'highest', badge: 'Hi', label: 'Highest bid/price' },
        { key: 'lowest', badge: 'Lo', label: 'Lowest bid/price' },
        { key: 'ending', badge: 'End', label: 'Ending soon' },
        { key: 'bids', badge: 'Bid', label: 'Most bids' },
        { key: 'rarity', badge: 'Rar', label: 'Highest rarity' },
        { key: 'random', badge: 'Rnd', label: 'Random' },
      ];

      let auctionTypeIndex = 0;
      let rarityIndex = 0;
      let sortIndex = 0;
      let searchText = '';
      let searchDebounce = null;
      let isSearchOpen = false;

      function openSearch() {
        if (isSearchOpen) return;
        isSearchOpen = true;
        searchWrap.classList.add('ah-search--open');
        searchToggle.setAttribute('aria-expanded', 'true');
        searchInput.focus();
        if (searchInput.value) searchInput.select();
      }

      function closeSearchIfEmpty() {
        if (!isSearchOpen) return;
        if (String(searchInput.value || '').trim()) return;
        isSearchOpen = false;
        searchWrap.classList.remove('ah-search--open');
        searchToggle.setAttribute('aria-expanded', 'false');
      }

      function applyAuctionType() {
        const option = auctionTypeOptions[auctionTypeIndex];
        auctionTypeIcon.src = option.icon;
        auctionTypeBtn.title = `Auction Type - ${option.key === 'bin' ? 'Buy It Now' : option.key === 'auction' ? 'Classic Auction' : 'Both'}`;
        applyFilters();
      }

      function applyRarity() {
        const option = rarityOptions[rarityIndex];
        rarityIcon.src = option.icon;
        rarityBtn.title = `Item Rarity - ${option.key === 'all' ? 'All rarities' : option.key}`;
        applyFilters();
      }

      function applySort() {
        const option = sortOptions[sortIndex];
        sortBtn.title = `Sorting - ${option.label}`;
        applyFilters();
      }

      auctionTypeBtn.addEventListener('click', () => {
        auctionTypeIndex = (auctionTypeIndex + 1) % auctionTypeOptions.length;
        console.log(`[Auction] Auction type changed to: ${auctionTypeOptions[auctionTypeIndex].key}`);
        applyAuctionType();
      });

      rarityBtn.addEventListener('click', () => {
        rarityIndex = (rarityIndex + 1) % rarityOptions.length;
        console.log(`[Auction] Rarity filter changed to: ${rarityOptions[rarityIndex].key}`);
        applyRarity();
      });

      sortBtn.addEventListener('click', () => {
        sortIndex = (sortIndex + 1) % sortOptions.length;
        console.log(`[Auction] Sort changed to: ${sortOptions[sortIndex].key}`);
        applySort();
      });

      searchToggle.addEventListener('click', () => {
        console.log('[Auction] Search toggle clicked');
        openSearch();
      });

      searchWrap.addEventListener('click', (e) => {
        if (e.target === searchToggle) return;
        if (e.target === searchInput) return;
        openSearch();
      });

      searchInput.addEventListener('focus', () => {
        openSearch();
      });

      searchInput.addEventListener('input', (e) => {
        const value = String(e.target.value || '');
        console.log(`[Auction] Search input: "${value}"`);
        if (searchDebounce) window.clearTimeout(searchDebounce);
        searchDebounce = window.setTimeout(() => {
          searchText = value.trim();
          applyFilters();
        }, 150);
      });

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          searchInput.blur();
          closeSearchIfEmpty();
        }
      });

      searchInput.addEventListener('blur', () => {
        window.setTimeout(() => closeSearchIfEmpty(), 0);
      });

      applyAuctionType();
      applyRarity();
      applySort();
      console.log('[Auction] Filter initialization complete');
    })();
  </script>
</body>

</html>
