<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SkyBlock Calendar &amp; Event Timers — CraftersMC Guides</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Live SkyBlock event countdowns, calendar schedule, and seasonal festival timings for CraftersMC." />
  <link rel="icon" href="assets/cmc-icon.png" type="image/png" />
  <link rel="icon" href="assets/cmc-guides.png" type="image/png" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <!-- Anti-flash Theme Init -->
  <script>
    (function () {
      try {
        var d = localStorage.getItem("darkMode");
        if (d === "true" || (d === null && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("darkmode");
        }
      } catch (e) {}
    })();
  </script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/skycalendar.css" />
  <link rel="stylesheet" href="css/essential.css" />
  <link rel="stylesheet" href="css/neo-brutalism.css" />

  <!-- Scripts -->
   
  <script src="better-api-docs/app.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/calendarengine.js" defer></script>
  <script src="js/calendaruicontroller.js" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body>

  <!-- Fullscreen / Layout Overlays -->
  <div class="background"></div>

  <!-- Top Navigation (Loaded dynamically from /components/navbar.html) -->
  <div class="top"></div>

  <!-- Navigation Sidebar (Loaded dynamically from /components/sidebar.html) -->
  <div class="sidebar" id="sidebar"></div>
  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Main Content Area -->
    <main class="neo-container" id="main-content">

      <!-- Top Overview Bar -->
      <div class="calendar-top-card neo-hero-card">
        <div class="calendar-top-info">
          <h1>SkyBlock Calendar &amp; Event Timers</h1>
          <p id="date-top">Loading current date...</p>
        </div>
        <button id="go-to-today-btn" class="btn-today neo-card-btn cyan" onclick="toToday()">
          <span class="material-icons" style="font-size:1.1rem; color:black;">my_location</span>
          Go to Today
        </button>
      </div>

      <!-- Calendar Grid Card -->
      <div class="calendar-card neo-hero-card">
        <div class="calendar-card-header">
          <h2>
            <span class="material-icons" style="color:var(--accent-color);">calendar_month</span>
            Calendar &bull; Year <span id="year">1</span>
          </h2>
          <div class="pagination-controls">
            <button id="prev-page" class="pagination-btn neo-card-btn cyan">&larr; Prev</button>
            <span class="pagination-text">Page <span id="page-counter">1</span></span>
            <button id="next-page" class="pagination-btn neo-card-btn cyan">Next &rarr;</button>
          </div>
        </div>
        <div id="grid"></div>
      </div>

      <!-- Upcoming Events Card -->
      <div class="calendar-card neo-hero-card">
        <div class="calendar-card-header">
          <h2>
            <span class="material-icons" style="color:#ea580c;">timer</span>
            Upcoming Events &amp; Countdowns
          </h2>
        </div>
        <div id="events-list"></div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="site-footer-left">CraftersMC Guides Project &bull; Unofficial Community Guides &amp; Documentation</div>
      <div class="site-footer-right">
        <a href="https://github.com/CraftersMC-Guides-Project/guides-code" target="_blank">GitHub</a>
      </div>
    </footer>
  </div>

  <!-- Day Details Modal Dialog -->
  <div id="day-modal" class="modal-overlay">
    <div class="modal-content neo-hero-card">
      <button id="modal-close-btn" class="modal-close-btn neo-card-btn cyan" style="font-size:1.2rem; padding:5px 7px;">&times;</button>
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <p id="modal-subtitle"></p>
        <p id="modal-timer" style="color:var(--cal-countdown); font-family:var(--font-mono); font-weight:700; margin-top:0.5em;"></p>
      </div>
      <div class="modal-body">
        <h4 id="modal-events-title">Scheduled Events</h4>
        <ul id="modal-event-list"></ul>
      </div>
    </div>
  </div>

</body>
</html>
