<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SkyBlock Calendar &amp; Event Timers — CraftersMC Guides</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Live SkyBlock event countdowns, calendar schedule, and seasonal festival timings for CraftersMC." />
  <link rel="icon" href="assets/cmc-icon.png" type="image/png" />
  <link rel="icon" href="assets/cmc-guides.png" type="image/png" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="better-api-docs/style.css" />
  <link rel="stylesheet" href="css/skycalendar.css" />

  <!-- Scripts -->
  <script src="better-api-docs/app.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/calendarengine.js" defer></script>
  <script src="js/calendaruicontroller.js" defer></script>
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="top-header">
    <div class="header-left">
      <button type="button" class="mobile-menu-btn" aria-label="Toggle navigation menu">
        <span class="material-icons" style="font-size:1.25rem;">menu</span>
      </button>
      <a href="index.html" class="header-brand">
        <img src="assets/cmc-guides.png" alt="CraftersMC Logo" />
        <div class="brand-text">
          <span class="brand-title">CraftersMC Guides</span>
          <span class="version-badge">SkyCalendar</span>
        </div>
      </a>
    </div>

    <!-- Search Box -->
    <div class="search-box">
      <span class="material-icons search-icon">search</span>
      <input type="text" id="search-input" placeholder="Search events, guides, API..." />
      <span class="search-kbd-shortcut">/</span>
    </div>

    <!-- Header Utility Links -->
    <div class="header-actions">
      <a href="better-api-docs/index.html" class="header-link" style="color: var(--accent-color); font-weight: 600;"><span class="material-icons" style="font-size:1rem; vertical-align:middle;">api</span> <span class="header-link-text">API Docs</span></a>
      <a href="https://github.com/CraftersMC-Guides-Project/guides-code" target="_blank" class="header-link"><span class="material-icons" style="font-size:1rem; vertical-align:middle;">code</span> <span class="header-link-text">GitHub</span></a>
    </div>
  </header>

  <!-- Application Layout -->
  <div class="app-layout">

    <!-- Left Sidebar Web Component -->
    <cmc-sidebar active="skycalendar"></cmc-sidebar>

    <!-- Main Content Area -->
    <main class="main-content">

      <!-- Top Overview Bar -->
      <div class="calendar-top-card">
        <div class="calendar-top-info">
          <h1>SkyBlock Calendar &amp; Event Timers</h1>
          <p id="date-top">Loading current date...</p>
        </div>
        <button id="go-to-today-btn" class="btn-today" onclick="toToday()">
          <span class="material-icons" style="font-size:1.1rem;">my_location</span>
          Go to Today
        </button>
      </div>

      <!-- Calendar Grid Card -->
      <div class="calendar-card">
        <div class="calendar-card-header">
          <h2>
            <span class="material-icons" style="color:var(--accent-color);">calendar_month</span>
            Calendar &bull; Year <span id="year">1</span>
          </h2>
          <div class="pagination-controls">
            <button id="prev-page" class="pagination-btn">&larr; Prev</button>
            <span class="pagination-text">Page <span id="page-counter">1</span></span>
            <button id="next-page" class="pagination-btn">Next &rarr;</button>
          </div>
        </div>
        <div id="grid"></div>
      </div>

      <!-- Upcoming Events Card -->
      <div class="calendar-card">
        <div class="calendar-card-header">
          <h2>
            <span class="material-icons" style="color:#ea580c;">timer</span>
            Upcoming Events &amp; Countdowns
          </h2>
        </div>
        <div id="events-list"></div>
      </div>

      <!-- Footer -->
      <footer class="site-footer">
        <div class="site-footer-left">CraftersMC Guides Project &bull; Unofficial Community Guides &amp; Documentation</div>
        <div class="site-footer-right">
          <a href="https://github.com/CraftersMC-Guides-Project/guides-code" target="_blank">GitHub</a>
        </div>
      </footer>

    </main>
  </div>

  <!-- Day Details Modal Dialog -->
  <div id="day-modal" class="modal-overlay">
    <div class="modal-content">
      <button id="modal-close-btn" class="modal-close-btn">&times;</button>
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <p id="modal-subtitle"></p>
        <p id="modal-timer" style="color:var(--cal-countdown); font-family:var(--font-mono); font-weight:700; margin-top:0.5em;"></p>
      </div>
      <div class="modal-body">
        <h4 id="modal-events-title">Scheduled Events</h4>
        <ul id="modal-event-list"></ul>
      </div>
    </div>
  </div>

</body>
</html>
